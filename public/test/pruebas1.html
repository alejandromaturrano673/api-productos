<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      /* Cómo aplicaría los estilos Bootstrap/Bulma */
      .importante {
        text-align: center;
        display: block;
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        color: rgb(58, 122, 240);
        text-shadow: 0px 0px 2px gray;
      }

      /* Cómo funciona Tailwind */
      .centrado {
        text-align: center;
      }
      .ancho {
        display: block;
      }
      .texto {
        font-weight: bold;
        font-family: Arial, Helvetica, sans-serif;
      }
      .texto-md {
        font-size: 24px;
      }
      .color-blue {
        color: rgb(58, 122, 240);
      }
      .color-red {
        color: rgb(217, 74, 34);
      }
      .sombra {
        text-shadow: 0px 0px 2px gray;
      }
    </style>

    <span class="importante">Ingenieria de Software</span>
    <span class="centrado ancho texto texto-md color-blue sombra"
      >Jhon Francia Minaya</span
    >
    <span class="centrado ancho texto texto-md color-red"
      >Hola mundo cruel</span
    >
  </body>
</html>
