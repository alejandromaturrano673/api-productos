<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        border: 0px;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: normal;
      }
      .contenedor {
        width: 90%;
        margin: 0 auto;
        background-color: antiquewhite;
        padding: 0.5rem;
        text-align: center;
      }
      .tarjeta {
        padding: 1rem;
        width: 350px;
        background-color: aqua;
        display: inline-block;
        border-radius: 10px;
        margin-bottom: 0.25rem;
      }
      .tarjeta a {
        text-decoration: none;
        font-size: 12px;
      }

      .tarjeta a:hover {
        text-decoration: underline;
      }
      .tarjeta h5 {
        font-style: italic;
        margin-bottom: 0.25rem;
      }
    </style>

    <select name="selector-carreras" id="selector-carreras">
      <option value="">Mostrar todas</option>
      <option value="Ingenieria de Software">Ingenieria de Software</option>
      <option value="Diseño Gráfico Digital">Diseño Gráfico Digital</option>
      <option value="Administración Industrial">
        Administración Industrial
      </option>
    </select>

    <div class="contenedor"></div>

    <script>
      /* Imaginemos que los datos para las tarjetas vienen de una consulta */
      /* Con esta información ¿cómo las renderizamos? */
      const alumnos = [
        {
          apellidos: "Francia Minaya",
          nombres: "Jhon Edward",
          carrera: "Ingenieria de Software",
          telefono: "956111222",
          correo: "jhon@gmail.com",
        },
        {
          apellidos: "Martinez Crisostomo",
          nombres: "Margarita",
          carrera: "Diseño Gráfico Digital",
          telefono: "956222333",
          correo: "margarita@gmail.com",
        },
        {
          apellidos: "Flores Atuncar",
          nombres: "Arturo Jose",
          carrera: "Ingenieria de Software",
          telefono: "956111000",
          correo: "arturo@gmail.com",
        },
        {
          apellidos: "Penaloza Perez",
          nombres: "Carlos",
          carrera: "Administracion Industrial",
          telefono: "956444777",
          correo: "carlos@gmail.com",
        },
        {
          apellidos: "Quintana Perea",
          nombres: "Flor Katherine",
          carrera: "Diseño Gráfico Digital",
          telefono: "956777000",
          correo: "flor@gmail.com",
        },
      ];

      const contenedor = document.querySelector(".contenedor"); // . = clase
      const selector = document.getElementById("selector-carreras");

      //Evento (¿Cuándo ejecutamos la instrucción?)
      selector.addEventListener("change", function () {
        renderizarTarjetas(selector.value);
      });

      //Continuamos ...
      //Manejo de DOM Document Object Model

      //Esta función requiere el nombre de una carrera (opcional), aplicar
      //el filtro con el nombre de la carrera, en caso esté vacia, mostrar todo
      function renderizarTarjetas(carrera = "") {
        contenedor.innerHTML = "";

        let listaFiltrada = [];
        if (carrera.trim() === "") {
          listaFiltrada = alumnos;
        } else {
          listaFiltrada = alumnos.filter(
            (alumno) => alumno.carrera === carrera,
          );
        }

        //Paso 1 - Recorrer todo el arrreglo
        listaFiltrada.forEach((alumno) => {
          // if (carrera.trim() !== "" && alumno.carrera !== carrera) {
          //   return;
          // }
          const nuevaTarjeta = /*html*/ `
            <div class="tarjeta">
              <h4>${alumno.apellidos}, ${alumno.nombres}</h4>
              <h5>${alumno.carrera}</h5>
              <a href="tel:${alumno.telefono}">Contactar</a>
              <a href="mailto:${alumno.correo}">Enviar correo</a>
            </div>
          `;
          contenedor.innerHTML += nuevaTarjeta;
        });
      }
      // renderizarTarjetas("Ingenieria de Software");
      // renderizarTarjetas("Diseño Gráfico Digital");
      renderizarTarjetas();
    </script>
  </body>
</html>
