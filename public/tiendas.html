<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ"
      crossorigin="anonymous"
    />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="container py-4">
      <div class="nav-overflow mb-6" data-bs-toggle="nav-overflow">
        <ul class="nav nav-pills">
          <li class="nav-item">
            <a class="nav-link" href="/">Productos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="#">Tiendas</a>
          </li>
        </ul>
      </div>

      <h2 class="mb-4">Gestion de tiendas</h2>
      <div id="mensaje" class="mb-3"></div>

      <div class="row g-4">
        <div class="col-12 md:col-4">
          <div class="card">
            <div class="card-header" id="tituloFormulario">Nueva tienda</div>
            <div class="card-body">
              <form id="formProducto">
                <input type="hidden" id="id" />

                <div class="mb-3">
                  <label for="ciudad" class="form-label">Ciudad</label>
                  <input
                    type="text"
                    id="ciudad"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="direccion" class="form-label">Direccion</label>
                  <input
                    type="text"
                    id="direccion"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="telefono" class="form-label">Telefono</label>
                  <input
                    type="number"
                    id="telefono"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="responsable" class="form-label"
                    >Responsable</label
                  >
                  <input
                    type="text"
                    id="responsable"
                    class="form-control"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="apertura" class="form-label">Apertura</label>
                  <input
                    type="time"
                    id="apertura"
                    class="form-control"
                    required
                    step="1"
                  />
                </div>

                <div class="mb-3">
                  <label for="cierre" class="form-label">Cierre</label>
                  <input
                    type="time"
                    id="cierre"
                    class="form-control"
                    required
                    step="1"
                  />
                </div>

                <div>
                  <button type="submit" class="btn-solid theme-primary">
                    Guardar
                  </button>
                  <button type="button" class="btn-solid theme-secondary">
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 md:col-8">
          <form id="formBuscar" class="d-flex gap-2 mb-3">
            <input
              type="text"
              id="buscarId"
              class="form-control"
              placeholder="Escriba el ID"
              required
            />
            <button type="submit" class="btn-solid theme-secondary">
              Buscar
            </button>
            <button
              type="button"
              id="mostrarTodos"
              class="btn-solid theme-secondary"
            >
              Ver todos
            </button>
          </form>

          <div class="table-resposive">
            <table class="table table-striped table-hover">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Ciudad</th>
                  <th>Direccion</th>
                  <th>Telefono</th>
                  <th>Responsable</th>
                  <th>Apertura</th>
                  <th>Cierre</th>
                  <th>Acciones</th>
                </tr>
                <tr></tr>
              </thead>
              <tbody id="cuerpoTabla"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/tiendas.js"></script>
  </body>
</html>
